<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Herramientas - Tareas</title>
</head>

<body>
	<h1>Pequeñas utilidades</h1>
	<p>Selecciona la acción que quieres realizar:</p>

	<label><input type="radio" name="tool" value="hipo" checked onchange="showForm()"> Calcular hipotenusa</label>
	<label><input type="radio" name="tool" value="num" onchange="showForm()"> Número mayor</label>
	<label><input type="radio" name="tool" value="bin" onchange="showForm()"> Conversión binario/decimal</label>

	<hr />

	<!-- Formulario Hipotenusa -->
	<div id="form-hipo">
		<h2>Calcular hipotenusa (c = √(a² - b²))</h2>
		<form method="post" action="Hipotenusa">
			<label>a: <input name="a" /></label><br />
			<label>b: <input name="b" /></label><br />
			<button type="submit">Calcular</button>
		</form>
	</div>

	<!-- Formulario Numeros -->
	<div id="form-num" style="display:none;">
		<h2>Encontrar el número mayor</h2>
		<form method="post" action="Numeros">
			<label>a: <input name="a" /></label><br />
			<label>b: <input name="b" /></label><br />
			<label>c: <input name="c" /></label><br />
			<button type="submit">Calcular</button>
		</form>
	</div>

	<!-- Formulario Binarios -->
	<div id="form-bin" style="display:none;">
		<h2>Conversión Binario ⇄ Decimal</h2>
		<form method="post" action="Binarios">
			<label>Valor: <input name="valor" /></label><br />
			<label>Tipo:
				<select name="tipo">
					<option value="toDecimal">Binario → Decimal</option>
					<option value="toBinary">Decimal → Binario</option>
				</select>
			</label><br />
			<button type="submit">Convertir</button>
		</form>
	</div>

	<script>
		function showForm() {
			var sel = document.querySelector('input[name="tool"]:checked').value;
			document.getElementById('form-hipo').style.display = (sel === 'hipo') ? 'block' : 'none';
			document.getElementById('form-num').style.display = (sel === 'num') ? 'block' : 'none';
			document.getElementById('form-bin').style.display = (sel === 'bin') ? 'block' : 'none';
		}
		// Asegurar que se muestre el formulario inicial correctamente
		document.addEventListener('DOMContentLoaded', showForm);
	</script>
</body>

</html>
